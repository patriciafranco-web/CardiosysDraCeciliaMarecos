<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Paciente - CardioSys</title>
</head>
<body style="font-family:Segoe UI; background:#f4f7f6; margin:0; display:flex; height:100vh;">
    <!-- Sidebar -->
    <div style="width:260px; background:#1e293b; color:white; padding:20px; box-sizing:border-box; display:flex; flex-direction:column; height:100vh;">
        <h2 style="color:white; margin-top:0; margin-bottom:5px;">CardioSys 1.0</h2>
        <p style="color:#38bdf8; font-size:15px; font-weight:bold; margin-top:0; margin-bottom:5px;">Dra. Cecilia Marecos Viana</p>
        <p style="color:#94a3b8; font-size:11px; margin-top:0; margin-bottom:25px; line-height:1.2;">Reg. Prof. 13943<br>Cardiología Clínica y Diagnóstica</p>
        <ul style="list-style:none; padding:0; margin-top:0; flex:1;">
            <li style="margin:15px 0;"><a href="/" style="color:white; text-decoration:none;">📋 Lista de Pacientes</a></li>
            <li style="margin:15px 0;"><a href="/nuevo" style="color:white; text-decoration:none; font-weight:bold;">➕ Nuevo Paciente</a></li>
            <li style="margin:15px 0;"><a href="/estudios-lista" style="color:white; text-decoration:none;">📁 Lista de Estudios</a></li>
            <li style="margin:15px 0;"><a href="/estudios-nuevo" style="color:white; text-decoration:none;">➕ Nuevo Estudio</a></li>
            <li style="margin:15px 0;"><a href="/cambiar-password" style="color:white; text-decoration:none;">🔑 Cambiar Contraseña</a></li>
        </ul>
        <div style="margin-bottom:20px;">
            <a href="/backup" style="display:block; background:#e67e22; color:white; padding:12px; text-align:center; text-decoration:none; border-radius:6px; font-weight:bold;">💾 Backup Manual</a>
            <a href="/logout" style="display:block; background:#ef4444; color:white; padding:8px; text-align:center; text-decoration:none; border-radius:6px; font-size:12px; font-weight:bold; margin-top:8px;">🚪 Cerrar Sesión</a>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div style="flex:1; padding:30px; overflow-y:auto;">
        <div style="background:white; padding:25px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.05); max-width:700px; margin:auto;">
            <h2 style="margin-top:0; color:#2c3e50; border-bottom:1px solid #eee; padding-bottom:10px;">➕ Registrar Nuevo Paciente</h2>
            
            <form method="POST">
                <div style="margin-bottom:15px;">
                    <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:5px;">Nombre y Apellido:</label>
                    <input type="text" name="nombre" required placeholder="Ej: Juan Pérez" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box;">
                </div>

                <div style="display:flex; gap:15px; margin-bottom:15px;">
                    <div style="flex:1;">
                        <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:5px;">Cédula (C.I.):</label>
                        <input type="text" name="cedula" placeholder="Ej: 1234567" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:5px;">Edad:</label>
                        <input type="number" name="nacimiento" placeholder="Ej: 55" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:5px;">Sexo:</label>
                        <select name="sexo" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box; background:white;">
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                        </select>
                    </div>
                </div>

                <div style="display:flex; gap:15px; margin-bottom:15px;">
                    <div style="flex:1;">
                        <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:5px;">Teléfono:</label>
                        <input type="text" name="telefono" placeholder="Ej: 0981234567" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:5px;">Profesión:</label>
                        <input type="text" name="profesion" placeholder="Ej: Docente" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box;">
                    </div>
                </div>

                <div style="display:flex; gap:15px; margin-bottom:15px;">
                    <div style="flex:1;">
                        <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:5px;">Sanatorio:</label>
                        <input type="text" name="sanatorio" placeholder="Ej: Sanatorio San Roque" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:5px;">Procedencia / Ciudad:</label>
                        <input type="text" name="direccion" placeholder="Ej: Ciudad del Este" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box;">
                    </div>
                </div>

                <!-- Antecedentes y Factores de Riesgo -->
                <div style="margin-bottom:15px;">
                    <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:5px;">Antecedentes y Factores de Riesgo Cardiovascular:</label>
                    <div style="background:#f8fafc; padding:15px; border:1px solid #ccc; border-radius:6px; display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:13px;">
                        <label><input type="checkbox" name="factores" value="Hipertensión Arterial (HTA)"> Hipertensión Arterial (HTA)</label>
                        <label><input type="checkbox" name="factores" value="Diabetes Mellitus (DBM)"> Diabetes Mellitus (DBM)</label>
                        <label><input type="checkbox" name="factores" value="Dislipidemia"> Dislipidemia</label>
                        <label><input type="checkbox" name="factores" value="Tabaquismo Activo"> Tabaquismo Activo</label>
                        <label><input type="checkbox" name="factores" value="Enfermedad Coronaria Previa"> Enfermedad Coronaria Previa</label>
                        <label><input type="checkbox" name="factores" value="IAM previo"> IAM previo</label>
                        <label><input type="checkbox" name="factores" value="Angioplastia / Stent"> Angioplastia / Stent</label>
                        <label><input type="checkbox" name="factores" value="Cirugía de Revascularización (CRM)"> Cirugía de Revascularización (CRM)</label>
                    </div>
                    <div style="margin-top:10px;">
                        <label><input type="checkbox" name="factores" value="Sin APP"> Sin APP</label>
                    </div>
                </div>

                <!-- NUEVA OPCIÓN: ¿TRAE ESTUDIOS CONSIGO? -->
                <div style="background:#f8fafc; border:1px solid #cbd5e1; padding:15px; border-radius:6px; margin-bottom:15px;">
                    <label style="font-weight:bold; font-size:13px; color:#2c3e50; display:block; margin-bottom:8px;">📁 ¿El paciente trae estudios previos consigo?</label>
                    <div style="display:flex; gap:20px;">
                        <label style="font-size:13px; cursor:pointer;"><input type="radio" name="tiene_estudios" value="Sí" style="margin-right:5px;"> Sí, trae estudios</label>
                        <label style="font-size:13px; cursor:pointer;"><input type="radio" name="tiene_estudios" value="No" checked style="margin-right:5px;"> No trae</label>
                    </div>
                </div>

                <div style="margin-bottom:20px;">
                    <label style="font-weight:bold; font-size:13px; color:#e74c3c; display:block; margin-bottom:5px;">Alergias:</label>
                    <input type="text" name="alergias" placeholder="Ej: Ninguna o Penicilina" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box;">
                </div>

                <button type="submit" style="background:#2ecc71; color:white; border:none; padding:12px 20px; border-radius:6px; font-weight:bold; cursor:pointer; width:100%; font-size:15px;">💾 Guardar Paciente</button>
            </form>
        </div>
    </div>
</body>
</html>
